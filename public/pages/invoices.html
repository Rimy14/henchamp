<!-- Filters -->
<div class="filters-card">
    <div class="filters-grid">
        <div class="form-group">
            <label>Search Invoice</label>
            <input type="text" id="searchInvoice" class="form-control" placeholder="Invoice #, Customer...">
        </div>
        <div class="form-group">
            <label>Status</label>
            <select id="statusFilter" class="form-control">
                <option value="">All</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>
        <div class="form-group">
            <label>From Date</label>
            <input type="date" id="fromDate" class="form-control">
        </div>
        <div class="form-group">
            <label>To Date</label>
            <input type="date" id="toDate" class="form-control">
        </div>
    </div>
    <div class="filter-actions">
        <button id="applyFilters" class="btn btn-primary">Apply Filters</button>
        <button id="resetFilters" class="btn btn-secondary">Reset</button>
    </div>
</div>

<!-- Invoices Table -->
<div class="table-container">
    <div class="table-scroll">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Invoice #</th>
                    <th>Date</th>
                    <th id="daysPassedHeader" style="display: none;">Payment Timeline</th>
                    <th>Customer</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Cashier</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="invoicesTable">
                <!-- Data will be populated here by invoices.js -->
            </tbody>
        </table>
    </div>
    <!-- Pagination -->
    <div id="paginationContainer"></div>
</div>

<!-- Invoice Details Modal -->
<div id="invoiceModal" class="modal">
    <div class="inv-modal-content">

        <div class="inv-modal-header">
            <div class="inv-header-left">
                <img src="/img/logo-white.png" alt="HenChamp Solutions" class="inv-logo">
                <div>

                    <div class="inv-header-label">INVOICE DETAILS</div>
                    <div id="modalInvoiceNumber" class="inv-header-number">—</div>
                </div>
            </div>
            <div class="inv-header-right">
                <div id="invStatusBadge" class="inv-status-badge">—</div>
                <button id="closeModal" class="inv-close-btn" title="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- ══ BODY ══ -->
        <div class="inv-modal-body">

            <!-- Info Grid -->
            <div id="invoiceDetails" class="inv-info-grid">
                <!-- JS populated -->
            </div>

            <!-- Line Items -->
            <div class="inv-section">
                <div class="inv-section-header">
                    <i class="fas fa-list-ul"></i>
                    <span>Line Items</span>
                    <div class="inv-section-line"></div>
                </div>
                <table class="inv-items-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th class="text-center">Qty</th>
                            <th class="text-right">Unit Price</th>
                            <th class="text-right">Discount</th>
                            <th class="text-right">Total</th>
                        </tr>
                    </thead>
                    <tbody id="modalItemsTable"></tbody>
                </table>
            </div>

            <!-- Totals + Actions side-by-side -->
            <div class="inv-bottom-row">
                <div id="modalTotals" class="inv-totals-card"></div>
                <div id="modalActions" class="inv-actions-panel"></div>
            </div>

        </div>
    </div>
</div>

<style>
    /* Overlay */
    #invoiceModal.modal {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: var(--z-modal);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
    }

    #invoiceModal.modal.active {
        opacity: 1;
        pointer-events: all;
    }

    /* Modal card */
    .inv-modal-content {
        background: white;
        border-radius: 0.75rem;
        width: 100%;
        max-width: 900px;
        max-height: 90vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        animation: invSlideIn 0.2s ease-out;
    }

    @keyframes invSlideIn {
        from {
            transform: translateY(12px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    /* ── Header ── */
    .inv-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.25rem 2rem;
        background: linear-gradient(135deg, #041710 0%, #0e4a35 100%);
        flex-shrink: 0;
    }


    .inv-header-left {
        display: flex;
        align-items: center;
        gap: 1rem;
        min-width: 0;
    }

    .inv-logo {
        height: 50px;
        width: auto;
        max-width: 160px;
        object-fit: contain;
        flex-shrink: 0;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.25));
    }


    .inv-header-label {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.85);
        text-transform: uppercase;
        margin-bottom: 0.1rem;
    }

    .inv-header-number {
        font-size: 1.6rem;
        font-weight: 700;
        color: white;
        line-height: 1.1;
    }

    .inv-header-right {
        display: flex;
        align-items: center;
        gap: 0.875rem;
        flex-shrink: 0;
    }

    .inv-status-badge {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0.35rem 0.85rem;
        border-radius: 999px;
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.15);
    }

    .inv-status-badge.status-completed {
        background: #10b981;
        border-color: #10b981;
    }

    .inv-status-badge.status-pending {
        background: #f59e0b;
        border-color: #f59e0b;
    }

    .inv-status-badge.status-cancelled {
        background: rgba(239, 68, 68, 0.25);
        border: 1.5px solid #ef4444;
        color: #ef4444;
    }

    .inv-close-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.15);
        color: white;
        font-size: 0.875rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
    }

    .inv-close-btn:hover {
        background: rgba(255, 255, 255, 0.25);
    }

    /* ── Body ── */
    .inv-modal-body {
        padding: 1.75rem 2rem;
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    /* ── Section Header ── */
    .inv-section-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        color: #1f2937;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .inv-section-header i {
        color: #0e4a35;
    }

    .inv-section-line {
        flex: 1;
        height: 1px;
        background: #e5e7eb;
    }

    /* ── Items Table ── */
    .inv-items-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
    }

    .inv-items-table thead tr {
        background: linear-gradient(135deg, #041710 0%, #0e4a35 100%);
    }


    .inv-items-table thead th {
        padding: 0.6rem 1rem;
        color: white;
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        text-align: left;
    }

    .inv-items-table thead th.text-center { text-align: center; }
    .inv-items-table thead th.text-right { text-align: right; }

    .inv-items-table tbody tr {
        border-bottom: 1px solid #f3f4f6;
    }

    .inv-items-table tbody tr:nth-child(even) {
        background: #fafafa;
    }

    .inv-items-table tbody td {
        padding: 0.75rem 1rem;
        color: #1f2937;
        vertical-align: middle;
    }

    .inv-items-table .text-center {
        text-align: center;
    }

    .inv-items-table .text-right {
        text-align: right;
    }

    .inv-item-name {
        font-weight: 600;
        color: #1f2937;
    }

    /* ── Bottom Row ── */
    .inv-bottom-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        align-items: start;
        margin-top: 0.5rem;
    }

    /* ── Totals Card ── */
    .inv-totals-card {
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        overflow: hidden;
        background: #f9fafb;
    }

    .inv-total-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        color: #4b5563;
    }

    .inv-total-row.grand {
        background: linear-gradient(135deg, #041710 0%, #0e4a35 100%);
        color: white;
        font-size: 1.1rem;
        font-weight: 700;
        padding: 0.75rem 1rem;
    }


    /* ── Actions Panel ── */
    .inv-actions-panel {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }

    .inv-actions-panel .btn {
        width: 100%;
        justify-content: center;
        padding: 0.65rem 1rem;
        font-size: 0.85rem;
        font-weight: 600;
        border-radius: 0.375rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .inv-cancelled-notice {
        background: #f9fafb;
        border: 1px dashed #d1d5db;
        border-radius: 0.5rem;
        padding: 1.5rem;
        text-align: center;
        color: #4b5563;
        font-size: 0.875rem;
    }

    .inv-cancelled-notice i {
        font-size: 1.75rem;
        display: block;
        margin-bottom: 0.5rem;
        color: #9ca3af;
    }

    /* Copy button next to invoice number */
    .btn-icon {
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        margin-left: 6px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 1rem;
        vertical-align: middle;
        transition: color 0.15s;
    }

    .btn-icon:hover {
        color: white;
    }

    /* Original price display when discount applied */
    .original-price {
        text-decoration: line-through;
        color: #9ca3af;
        font-size: 0.85em;
        margin-right: 6px;
    }

    /* Discount percentage badge in line items */
    .discount-badge {
        background: #e2e8f0;
        color: #475569;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.75em;
        font-weight: 600;
    }

    /* Compact summary lines */
    .inv-summary-line {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        margin-bottom: 0.5rem;
        color: #4b5563;
        font-size: 0.92rem;
    }

    .inv-summary-line i {
        margin-right: 4px;
        color: #9ca3af;
    }

    /* Action button groups */
    .action-group {
        display: flex;
        gap: 8px;
    }

    /* Outline danger button (Void) */
    .btn-outline-danger {
        border: 1px solid #ef4444;
        color: #ef4444;
        background: transparent;
    }

    .btn-outline-danger:hover {
        background: #ef4444;
        color: #fff;
    }

    /* Large button variant (Receive Payment) */
    .btn-lg {
        padding: 10px 24px;
        font-size: 0.95rem;
    }

    @media (max-width: 768px) {
        .inv-bottom-row {
            grid-template-columns: 1fr;
        }
        .inv-modal-body {
            padding: 1.25rem 1.5rem;
        }
    }
</style>


<!-- Cancel Invoice Reason Modal -->
<div id="cancelInvoiceModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
            <h2>Cancel Invoice</h2>
            <button id="closeCancelModal" class="close-btn">&times;</button>
        </div>

        <div class="modal-body">
            <div class="alert alert-warning"
                style="margin-bottom: 1.5rem; padding: 1rem; background: #fff3cd; border: 1px solid #ffc107; border-radius: var(--radius-md); color: #856404;">
                <i class="fas fa-exclamation-triangle" style="margin-right: 0.5rem;"></i>
                <strong>Warning:</strong> This action will cancel the invoice and restore stock. This cannot be undone.
            </div>

            <div class="form-group">
                <div style="margin-bottom: 10px; display: flex; align-items: center;">
                    <input type="checkbox" id="cancelReturnCheckbox" style="margin-right: 8px; width: auto;">
                    <label for="cancelReturnCheckbox" style="margin-bottom: 0; font-weight: 600; cursor: pointer;">Mark
                        as Return</label>
                </div>
                <label for="cancelReason" style="font-weight: 600; margin-bottom: 0.5rem; display: block;">
                    <i class="fas fa-comment-alt" style="color: var(--primary-color); margin-right: 0.5rem;"></i>
                    Reason for Cancellation *
                </label>
                <textarea id="cancelReason" class="form-control" rows="4"
                    placeholder="Please provide a detailed reason for cancelling this invoice (minimum 10 characters)..."
                    required style="resize: vertical; min-height: 100px;"></textarea>
                <div id="cancelReasonError"
                    style="color: var(--danger); font-size: 0.875rem; margin-top: 0.5rem; display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="cancelReasonErrorText">Please provide a reason (minimum 10 characters)</span>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeCancelReasonModal()">
                Cancel
            </button>
            <button type="button" class="btn btn-danger" onclick="confirmCancellation()">
                <i class="fas fa-ban"></i> Confirm Cancellation
            </button>
        </div>
    </div>
</div>
