<!-- Page Actions / Filters -->
<div class="page-actions">
    <div style="display: flex; gap: 1rem; align-items: center;">
        <div class="form-group" style="margin: 0;">
            <label>Filter by Payment Status</label>
            <select id="paymentStatusFilter" class="form-control" style="width: 200px;">
                <option value="">All Statuses</option>
                <option value="unpaid">Unpaid</option>
                <option value="partial">Partially Paid</option>
                <option value="paid">Paid</option>
            </select>
        </div>
        <div class="form-group" style="margin: 0;">
            <label>Search PO # / Supplier</label>
            <input type="text" id="poSearchInput" class="form-control" style="width: 250px;" placeholder="Search...">
        </div>
    </div>
</div>

<!-- PO Table -->
<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th>PO Details</th>
                <th>Supplier</th>
                <th>Dates</th>
                <th>Amount Details</th>
                <th>Outstanding</th>
                <th>Payment Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="poPaymentsTableBodyMain">
            <!-- Data will be populated here by po-payments.js -->
        </tbody>
    </table>
    <div id="poPaymentsPaginationContainer"></div>
</div>

<!-- PO Payments Modal -->
<div id="poPaymentsModal" class="modal">
    <div class="modal-content" style="max-width: 800px;">
        <div class="modal-header">
            <h2>Manage PO Payments</h2>
            <button type="button" class="close-btn" onclick="window.hidePaymentsModal && window.hidePaymentsModal()">&times;</button>
        </div>

        <div style="padding: 1rem;">
            <!-- PO Info Header -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; background: var(--gray-50); padding: 1rem; border-radius: var(--radius-md);">
                <div>
                    <span style="font-size: 0.85rem; color: var(--gray-500); display: block;">PO Number</span>
                    <strong id="payPOModalNumber" style="font-size: 1.1rem;">-</strong>
                </div>
                <div>
                    <span style="font-size: 0.85rem; color: var(--gray-500); display: block;">Supplier</span>
                    <span id="payPOModalSupplier" style="font-weight: 500;">-</span>
                </div>
                <div>
                    <span style="font-size: 0.85rem; color: var(--gray-500); display: block;">Total Amount</span>
                    <strong id="payPOModalTotal" style="color: var(--primary-600);">-</strong>
                </div>
                <div>
                    <span style="font-size: 0.85rem; color: var(--gray-500); display: block;">Total Paid</span>
                    <span id="payPOModalPaid" style="font-weight: 500;">-</span>
                </div>
                <div>
                    <span style="font-size: 0.85rem; color: var(--gray-500); display: block;">Outstanding</span>
                    <strong id="payPOModalOutstanding" style="color: var(--danger);">-</strong>
                </div>
            </div>

            <!-- Existing Payments List -->
            <h3 style="margin-top: 1.5rem; margin-bottom: 0.75rem;">Payment History</h3>
            <div class="table-container" style="max-height: 220px; overflow-y: auto; margin-bottom: 1.5rem;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Method</th>
                            <th>Reference</th>
                            <th>Amount</th>
                            <th>Recorded By</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="poPaymentsTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; color: var(--gray-500);">
                                No payments recorded yet
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>


            <!-- Record New Payment Form -->
            <div id="newPaymentFormContainer" style="border-top: 1px solid var(--gray-200); padding-top: 1.5rem;">
                <h3 style="margin-bottom: 1rem;">Record New Payment</h3>
                <form id="poPaymentForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Payment Date *</label>
                            <input type="date" id="payDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Payment Method *</label>
                            <select id="payMethod" class="form-control" required>
                                <option value="Bank Transfer">Bank Transfer</option>
                                <option value="Cash">Cash</option>
                                <option value="Cheque">Cheque</option>
                                <option value="Card">Card</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Amount (Rs) *</label>
                            <input type="number" id="payAmount" class="form-control" step="0.01" min="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Reference # (Cheque/Tx ID)</label>
                            <input type="text" id="payReference" class="form-control" placeholder="Optional">
                        </div>
                        <div class="form-group form-grid-full">
                            <label>Notes</label>
                            <textarea id="payNotes" class="form-control" rows="2" placeholder="Optional transaction details"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer" style="padding: 1rem 0 0 0; border-top: none;">
                        <button type="submit" class="btn btn-primary">Record Payment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
