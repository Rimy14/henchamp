<div class="page-header-actions">
    <button id="createBOMBtn" class="btn btn-primary">
        <i class="fas fa-plus"></i> Create BOM
    </button>
</div>

<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th>Finished Good</th>
                <th>Code</th>
                <th>Category</th>
                <th>Version</th>
                <th>Components</th>
                <th>Status</th>
                <th>Created By</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="bomTableBody">
            <tr>
                <td colspan="8" style="text-align:center;padding:2rem">Loading...</td>
            </tr>
        </tbody>
    </table>
    <div id="paginationContainer"></div>
</div>

<div id="bomModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin-bottom: 1.5rem;">Create Bill of Materials</h2>
        <form id="bomForm">
            <div class="form-group">
                <label>Finished Good *</label>
                <select id="finishedGood" class="form-control" required>
                    <option value="">Select...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="bomDescription" class="form-control" rows="2"></textarea>
            </div>

            <div class="items-section">
                <h3>Raw Materials</h3>
                <div class="item-input-row">
                    <div class="form-group" style="margin:0">
                        <label>Material</label>
                        <select id="rawMaterialSelect" class="form-control">
                            <option value="">Select...</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin:0">
                        <label>Quantity</label>
                        <input type="number" id="materialQuantity" class="form-control" min="0" step="0.01" value="1">
                    </div>
                    <button type="button" id="addMaterialBtn" class="btn btn-primary">Add</button>
                </div>
                <div class="form-group" style="margin-top: 0.75rem;">
                    <label>Notes</label>
                    <input type="text" id="materialNotes" class="form-control">
                </div>

                <table class="data-table components-table">
                    <thead>
                        <tr>
                            <th>Material</th>
                            <th>Code</th>
                            <th>Unit</th>
                            <th>Quantity</th>
                            <th>Notes</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="bomComponentsTable">
                        <tr>
                            <td colspan="6" style="text-align:center;color:var(--gray-500)">No materials added</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="modal-footer">
                <button type="button" id="cancelBOMBtn" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Save BOM</button>
            </div>
        </form>
    </div>
</div>

<!-- View BOM Modal -->
<div id="viewBOMModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>BOM Details</h2>
            <button type="button" id="closeViewBOMBtn" class="close-btn">&times;</button>
        </div>
        <div id="viewBOMContent"></div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="closeViewBtnBottom">Close</button>
        </div>
    </div>
</div>
