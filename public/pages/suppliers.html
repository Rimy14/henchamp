<!-- Page Actions -->
<div class="page-actions">
    <div class="search-box">
        <div class="search-input-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="form-control"
                placeholder="Search suppliers by name, code, contact...">
        </div>
    </div>
    <button id="addSupplierBtn" class="btn btn-primary">
        <i class="fas fa-plus"></i> Add Supplier
    </button>
</div>

<!-- Suppliers Table -->
<div class="table-container">
    <div class="table-scroll">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Contact Person</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>City</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="suppliersTableBody">
                <!-- Data will be populated here by suppliers.js -->
            </tbody>
        </table>
    </div>
    <div id="paginationContainer"></div>
</div>

<!-- Supplier Modal -->
<div id="supplierModal" class="modal">
    <div class="modal-content" style="max-width: 800px; border-radius: 20px; overflow: hidden; border: none; box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);">
        <div class="modal-header" style="background: linear-gradient(135deg, #041710 0%, #0e4a35 100%); padding: 1.25rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08);">
            <div style="display: flex; align-items: center; gap: 0.85rem;">
                <div style="width: 40px; height: 40px; border-radius: 11px; background: rgba(132, 204, 22, 0.2); color: #a3e635; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; border: 1px solid rgba(132, 204, 22, 0.3);">
                    <i class="fas fa-truck-field"></i>
                </div>
                <div>
                    <h2 id="modalTitle" style="margin: 0; font-size: 1.2rem; font-weight: 700; color: #ffffff;">Add New Supplier</h2>
                    <p style="margin: 0.15rem 0 0 0; color: #94a3b8; font-size: 0.775rem;">Manage vendor profiles, tax PINs and payment terms</p>
                </div>
            </div>
            <button type="button" class="close-btn" id="closeModalBtn" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #cbd5e1; cursor: pointer;">&times;</button>
        </div>

        <form id="supplierForm" style="display: flex; flex-direction: column; max-height: calc(85vh - 75px); margin: 0; overflow: hidden;">
            <div class="modal-body" style="padding: 1.5rem; overflow-y: auto; flex: 1;">
                <div class="form-row">
                    <div class="form-group">
                        <label>Supplier Name *</label>
                        <input type="text" id="supplierName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Contact Person</label>
                        <input type="text" id="supplierContact" class="form-control">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="supplierEmail" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="tel" id="supplierPhone" class="form-control" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="supplierCity" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Country</label>
                        <input type="text" id="supplierCountry" class="form-control">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tax Number (VAT PIN)</label>
                        <input type="text" id="supplierTaxNumber" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Credit Limit</label>
                        <input type="number" id="supplierCreditLimit" class="form-control" step="0.01" value="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>Payment Terms</label>
                    <input type="text" id="supplierPaymentTerms" class="form-control" placeholder="e.g. Net 30, COD">
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea id="supplierAddress" class="form-control" rows="2"></textarea>
                </div>
            </div>

            <div class="modal-footer" style="padding: 1.25rem 1.5rem; border-top: 1px solid var(--gray-200); background: #ffffff; flex-shrink: 0; display: flex; gap: 0.75rem; justify-content: flex-end; margin: 0;">
                <button type="button" id="cancelBtn" class="btn btn-secondary" style="border-radius: 9px; padding: 0.6rem 1.25rem; font-weight: 600;">Cancel</button>
                <button type="submit" class="btn btn-primary" style="border-radius: 9px; padding: 0.6rem 1.5rem; font-weight: 600;">Save Supplier</button>
            </div>
        </form>

    </div>
</div>
