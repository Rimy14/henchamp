<div class="page-actions">
    <button id="addCategoryBtn" class="btn btn-primary">
        <i class="fas fa-plus"></i> Add Category
    </button>
</div>

<!-- Categories Table -->
<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>

                <th>Description</th>
                <th>Items</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="categoriesTable">
            <!-- Data will be populated here by categories.js -->
        </tbody>
    </table>
</div>

<!-- Add/Edit Category Modal -->
<div id="categoryModal" class="modal">
    <div class="modal-content" style="max-width: 500px; border-radius: 20px; overflow: hidden; border: none; box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);">
        <div class="modal-header" style="background: linear-gradient(135deg, #041710 0%, #0e4a35 100%); padding: 1.25rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08);">
            <div style="display: flex; align-items: center; gap: 0.85rem;">
                <div style="width: 40px; height: 40px; border-radius: 11px; background: rgba(132, 204, 22, 0.2); color: #a3e635; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; border: 1px solid rgba(132, 204, 22, 0.3);">
                    <i class="fas fa-cubes"></i>
                </div>
                <div>
                    <h2 id="modalTitle" style="margin: 0; font-size: 1.2rem; font-weight: 700; color: #ffffff;">Add Category</h2>
                    <p style="margin: 0.15rem 0 0 0; color: #94a3b8; font-size: 0.775rem;">Create or modify product classification</p>
                </div>
            </div>
            <button id="closeModal" class="close-btn" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #cbd5e1; cursor: pointer;">&times;</button>
        </div>

        <form id="categoryForm" style="display: flex; flex-direction: column; max-height: calc(85vh - 75px); margin: 0; overflow: hidden;">
            <input type="hidden" id="categoryId">
            <input type="hidden" id="categoryType" value="Finished Goods">

            <div class="modal-body" style="padding: 1.5rem; background: #ffffff; overflow-y: auto; flex: 1;">
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label for="categoryName" style="display: block; font-size: 0.8rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem;">Category Name <span style="color: #ef4444;">*</span></label>
                    <div style="position: relative;">
                        <i class="fas fa-tag" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 0.9rem;"></i>
                        <input type="text" id="categoryName" class="form-control" required placeholder="e.g., Electronics, Beverages, Hardware" style="padding-left: 2.4rem; border-radius: 9px; border: 1px solid #cbd5e1; font-size: 0.875rem;">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 0.5rem;">
                    <label for="categoryDescription" style="display: block; font-size: 0.8rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem;">Description</label>
                    <textarea id="categoryDescription" class="form-control" rows="3" placeholder="Provide category overview or details..." style="border-radius: 9px; border: 1px solid #cbd5e1; font-size: 0.875rem; padding: 0.75rem;"></textarea>
                </div>
            </div>

            <div class="modal-actions" style="padding: 1rem 1.5rem; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; gap: 0.75rem; justify-content: flex-end; flex-shrink: 0; margin: 0;">
                <button type="button" id="cancelBtn" class="btn btn-secondary" style="border-radius: 9px; font-weight: 600; font-size: 0.85rem; padding: 0.55rem 1.1rem; background: #ffffff; border: 1px solid #cbd5e1; color: #475569;">Cancel</button>
                <button type="submit" id="submitBtn" class="btn btn-primary" style="border-radius: 9px; font-weight: 600; font-size: 0.85rem; padding: 0.55rem 1.25rem; background: linear-gradient(135deg, #0e4a35 0%, #166044 100%); border: none; box-shadow: 0 4px 12px rgba(14, 74, 53, 0.25);">
                    <i class="fas fa-save" style="margin-right: 0.35rem;"></i> Save Category
                </button>
            </div>
        </form>
    </div>
</div>

<!-- View Category Modal -->
<div id="viewModal" class="modal">
    <div class="modal-content" style="max-width: 720px; border-radius: 20px; overflow: hidden; border: none; box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);">
        <div class="modal-header" style="background: linear-gradient(135deg, #041710 0%, #0e4a35 100%); padding: 1.25rem 1.75rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08);">
            <div style="display: flex; align-items: center; gap: 0.85rem;">
                <div style="width: 40px; height: 40px; border-radius: 11px; background: rgba(132, 204, 22, 0.2); color: #a3e635; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; border: 1px solid rgba(132, 204, 22, 0.3);">
                    <i class="fas fa-info-circle"></i>
                </div>
                <div>
                    <h2 id="viewCategoryTitle" style="margin: 0; font-size: 1.25rem; font-weight: 700; color: #ffffff;">Category Details</h2>
                    <p style="margin: 0.15rem 0 0 0; color: #94a3b8; font-size: 0.775rem;">Full hierarchy & inventory stats summary</p>
                </div>
            </div>
            <button id="closeViewModal" class="close-btn" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #cbd5e1; cursor: pointer;">&times;</button>
        </div>

        <div style="padding: 1.75rem; background: #ffffff;">
            <!-- Basic Information Card -->
            <div style="background: linear-gradient(135deg, #0e4a35 0%, #166044 100%); color: white; padding: 1.5rem; border-radius: 14px; margin-bottom: 1.5rem; box-shadow: 0 10px 20px -5px rgba(14, 74, 53, 0.3);">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div>
                        <div style="opacity: 0.85; font-size: 0.775rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem;">Category Name</div>
                        <div id="viewCatName" style="font-size: 1.5rem; font-weight: 800;">-</div>
                    </div>
                    <div>
                        <div style="opacity: 0.85; font-size: 0.775rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem;">Type</div>
                        <div id="viewCatType" style="font-size: 1.05rem; font-weight: 700; background: rgba(255,255,255,0.2); display: inline-block; padding: 0.25rem 0.85rem; border-radius: 20px; backdrop-filter: blur(4px);">
                            -</div>
                    </div>
                </div>
                <!-- Description Section -->
                <div style="margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.2);">
                    <div style="opacity: 0.85; font-size: 0.775rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem;">Description</div>
                    <div id="viewCatDescription" style="font-size: 0.95rem; opacity: 0.95; line-height: 1.4;">-</div>
                </div>
            </div>

            <!-- Info Grid -->
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; margin-bottom: 1.5rem;">
                <!-- Parent Info -->
                <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.25rem;">
                    <div style="display: flex; align-items: center; margin-bottom: 0.85rem; gap: 0.75rem;">
                        <div style="width: 38px; height: 38px; background: rgba(240, 147, 251, 0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #d946ef; font-size: 1.1rem;">
                            <i class="fas fa-sitemap"></i>
                        </div>
                        <h3 style="margin: 0; font-size: 0.95rem; font-weight: 700; color: #0f172a;">Hierarchy</h3>
                    </div>
                    <div style="display: grid; gap: 0.65rem;">
                        <div>
                            <div style="font-size: 0.75rem; color: #64748b; margin-bottom: 0.15rem;">Parent Category</div>
                            <div id="viewCatParent" style="font-weight: 700; color: #1e293b; font-size: 0.9rem;">-</div>
                        </div>
                        <div>
                            <div style="font-size: 0.75rem; color: #64748b; margin-bottom: 0.15rem;">Sub-categories</div>
                            <div id="viewCatSubCount" style="font-weight: 700; color: #1e293b; font-size: 0.9rem;">-</div>
                        </div>
                    </div>
                </div>

                <!-- Stats Info -->
                <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.25rem;">
                    <div style="display: flex; align-items: center; margin-bottom: 0.85rem; gap: 0.75rem;">
                        <div style="width: 38px; height: 38px; background: rgba(14, 74, 53, 0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #0e4a35; font-size: 1.1rem;">
                            <i class="fas fa-chart-bar"></i>
                        </div>
                        <h3 style="margin: 0; font-size: 0.95rem; font-weight: 700; color: #0f172a;">Statistics</h3>
                    </div>
                    <div style="background: #ffffff; padding: 0.85rem; border-radius: 10px; border: 1px solid #e2e8f0; text-align: center;">
                        <div style="font-size: 0.75rem; color: #64748b; font-weight: 600; text-transform: uppercase; margin-bottom: 0.25rem;">Total Linked Items</div>
                        <div id="viewCatItemCount" style="font-size: 1.75rem; font-weight: 800; color: #0e4a35;">-</div>
                    </div>
                </div>
            </div>

            <!-- Status Badge -->
            <div style="text-align: center; padding: 0.85rem; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0;">
                <span id="viewCatStatus" class="badge badge-success" style="font-size: 0.875rem; padding: 0.4rem 1.5rem; border-radius: 20px; font-weight: 700; background: rgba(16, 185, 129, 0.12); color: #047857; border: 1px solid rgba(16, 185, 129, 0.3);">Active</span>
            </div>
        </div>

        <div class="modal-actions" style="border-top: 1px solid #e2e8f0; padding: 1rem 1.75rem; background: #f8fafc; display: flex; justify-content: flex-end; gap: 0.75rem;">
            <button id="viewEditBtn" class="btn btn-secondary" style="border-radius: 9px; font-weight: 600; font-size: 0.85rem; padding: 0.55rem 1.1rem; background: #ffffff; border: 1px solid #cbd5e1; color: #334155;"><i class="fas fa-edit" style="margin-right: 0.35rem;"></i> Edit</button>
            <button id="closeViewBtn" class="btn btn-primary" style="border-radius: 9px; font-weight: 600; font-size: 0.85rem; padding: 0.55rem 1.25rem; background: linear-gradient(135deg, #0e4a35 0%, #166044 100%); border: none;">Close</button>
        </div>
    </div>
</div>
